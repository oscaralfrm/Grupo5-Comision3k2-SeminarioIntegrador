# Configuraciones Básicas
spring.application.name=BackendHarp

# Configuraciones de Seguridad de Spring Security...
# spring.security.user.name=${SS_USER}
# spring.security.user.password=${SS_PASSWORD}
# spring.security.user.roles=${SS_ROLE}

# Configuraciones de BD

BD_URL=jdbc:mysql://localhost:3306/harp-database?useSSL=false&serverTimezone=UTC
BD_PASSWORD=
BD_USER=root

server.port = 9001
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${BD_URL}
spring.datasource.username =${BD_USER}
spring.datasource.password =${BD_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Permitir archivos grandes en multipart/form-data
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


